<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="popup_page_title">arXiv to Markdown</title>
    <link rel="stylesheet" href="ui-v2.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="pop" id="pop">
      <header class="hd">
        <div class="logo"><img src="assets/icon-48.png" alt="" width="24" height="24" /></div>
        <h1 data-i18n="popup_title">arXiv to Markdown</h1>
        <button class="icon-btn" id="settingsBtn" data-i18n-title="popup_btn_settings" data-i18n-aria="popup_btn_settings" title="打开设置" aria-label="打开设置">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </header>

      <main class="body">
        <section id="ctxCard" class="card ctx" data-i18n-aria="popup_ctx_region" aria-label="当前页面">
          <span id="ctxBadge" class="badge idle" role="status" aria-live="polite">…</span>
          <div id="ctxTitle" class="t">…</div>
          <div id="ctxMeta" class="m"></div>
          <div id="ctxProg" class="prog hidden" aria-live="polite"><div class="l"><span id="ctxProgText"></span><span id="ctxProgPct"></span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="ctxProgBar"></i></div></div>
        </section>
        <div id="unsupported" class="card empty hidden">
          <div class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></div>
          <b class="empty-title" data-i18n="popup_unsupported_title">当前页面暂不支持</b><br /><span data-i18n="popup_unsupported_desc">打开 arXiv 论文页（/abs、/pdf、/html）后可用</span>
        </div>

        <div id="alertOk" class="alert ok hidden" role="status">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>
          <div><b data-i18n="popup_saved">已保存</b><span id="okFile"></span></div>
          <div class="x"><button id="okOpen" class="btn btn-ghost btn-xs hidden" data-i18n="popup_btn_open">打开</button></div>
        </div>
        <div id="alertErr" class="alert err hidden" role="alert">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>
          <div><b id="errTitle"></b><span id="errHint"></span><button id="refreshBtn" class="btn btn-secondary btn-xxs btn-refresh hidden" data-i18n="popup_btn_refresh">刷新</button></div>
        </div>
        <div id="alertKey" class="alert info hidden" role="status">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>
          <div><b id="keyHereTitle"></b><span id="keyHereHint"></span><button id="keySettingsBtn" class="btn btn-secondary btn-xxs btn-refresh" data-i18n="popup_btn_settings">打开设置</button></div>
        </div>
        <div id="alertInfo" class="alert info hidden">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>
          <div id="infoText" data-i18n="popup_dis_loading">页面仍在加载，就绪后可导出</div>
        </div>

        <div class="acts">
          <button id="exportBtn" class="btn btn-primary" disabled>
            <svg class="btn-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span class="spinner hidden" aria-hidden="true"></span><span class="label" data-i18n="popup_btn_export">导出 Markdown</span>
          </button>
          <button id="mineruBtn" class="btn btn-secondary" disabled aria-describedby="backendLabel"><span data-i18n="popup_btn_mineru">PDF 解析</span> <small id="backendLabel" class="backend-label"></small></button>
          <button id="pdfBtn" class="btn btn-secondary" disabled><span data-i18n="popup_btn_pdf">下载 PDF</span></button>
        </div>

        <div id="recent" class="recent hidden">
          <div class="sec-h"><span data-i18n="popup_recent">PDF 解析任务</span><span class="sec-x"><button id="clearCompletedBtn" class="btn btn-ghost btn-xxs hidden" data-i18n="popup_btn_clear_completed">清空已完成</button><button id="recentAll" class="btn btn-ghost btn-xxs hidden" aria-expanded="false"></button></span></div>
          <div id="recentEmpty" class="card recent-empty hidden" data-i18n="popup_recent_empty">用 PDF 解析导出后，任务进度会显示在这里</div>
          <div id="taskList" class="card list" tabindex="-1" role="region" aria-live="polite" data-i18n-aria="popup_task_list" aria-label="任务列表"></div>
        </div>
      </main>

      <footer class="ft">
        <span id="shortcutBox"><span id="shortcutPrefix" data-i18n="popup_shortcut">快捷键</span> <kbd id="shortcutKbd">Alt+Shift+M</kbd><span id="shortcutGuide" class="sc-guide hidden"></span></span>
        <span><span id="footerVersion">v</span><span class="hint"> · <span data-i18n="popup_footer_menu">右键也可导出</span></span></span>
      </footer>
    </div>

    <div class="confirm-overlay" id="confirmOverlay" hidden inert>
      <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmMessage" tabindex="-1">
        <h2 class="confirm-title" id="confirmTitle" hidden></h2>
        <p class="confirm-message" id="confirmMessage" data-i18n="popup_confirm_delete">确定要删除吗？</p>
        <div class="confirm-actions">
          <button class="confirm-btn confirm-cancel" id="confirmCancel" data-i18n="popup_btn_cancel">取消</button>
          <button class="confirm-btn confirm-ok" id="confirmOk" data-i18n="popup_btn_confirm">删除</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
