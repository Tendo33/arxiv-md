name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 先 build：tests/manifest-locales 要校验 dist/_locales（CI=true 时 dist 缺失直接失败）
      - run: npm run build
      - run: npm test
      - run: npm run check:keys
